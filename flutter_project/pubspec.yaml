name: campus_connect
description: "CampusConnect - Advanced College Management & Student Communication App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # State Management (IITM Pravartak Mandatory Requirement)
  provider: ^6.1.2
  # Local Persistent Storage
  shared_preferences: ^2.3.2
  # UI & Material Design 3
  google_fonts: ^6.2.1
  intl: ^0.19.0
  # Networking & HTTP
  http: ^1.2.1
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
